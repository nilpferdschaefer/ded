name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ded-linux-amd64
          - os: macos-latest
            artifact: ded-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m py_compile ded.py ded_tui.py ded_cursor.py
          python3 ded.py --help

      - name: Build binary
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ded-*
          path: dist/
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd dist
          for bin in ded-*; do
            [[ "$bin" == *.sha256 ]] && continue
            sha256sum "$bin" > "${bin}.sha256"
          done
          gh release create "$TAG" ded-* --title "$TAG" --generate-notes
